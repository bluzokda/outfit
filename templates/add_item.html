{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto glass-panel rounded-3xl p-6 sm:p-8 border border-purple-500/30 shadow-2xl">
    <h1 class="text-2xl font-bold text-white mb-6">Добавление вещи</h1>

    {% if error %}
        <div class="mb-6 p-4 rounded-xl bg-red-950/60 border border-red-500/40 text-red-200 text-sm">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" class="space-y-5">
        <div>
            <label class="block text-sm font-medium text-purple-200 mb-2">Фотография вещи</label>
            <input type="file" name="photo" accept="image/*" required
                class="w-full text-sm text-purple-300 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500 file:cursor-pointer bg-purple-950/30 rounded-xl border border-purple-500/20 p-2 transition">
        </div>

        <div>
            <label class="block text-sm font-medium text-purple-200 mb-2">Категория</label>
            <select name="category" required
                class="w-full px-4 py-3 rounded-xl bg-purple-950/50 border border-purple-500/30 text-white focus:outline-none focus:border-purple-400 transition">
                <option value="" disabled selected>Выбери категорию</option>
                {% for key, label in category_labels.items() %}
                    <option value="{{ key }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-purple-200 mb-2">Описание (необязательно)</label>
            <input type="text" name="description" placeholder="Напр.: Черное худи оверсайз"
                class="w-full px-4 py-3 rounded-xl bg-purple-950/50 border border-purple-500/30 text-white placeholder-purple-400/40 focus:outline-none focus:border-purple-400 transition">
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-white bg-gradient-to-r from-purple-600 to-indigo-600 neon-glow transition transform hover:-translate-y-0.5">
            Сохранить в гардероб
        </button>
    </form>
</div>
{% endblock %}
