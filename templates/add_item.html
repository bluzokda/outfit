{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto glass-panel rounded-3xl p-8 sm:p-10 border border-purple-500/30 shadow-2xl animate-fade-in">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-black text-white mb-2">Новая вещь</h1>
        <p class="text-xs text-purple-300/70">Загрузите фото и укажите категорию</p>
    </div>

    {% if error %}
        <div class="mb-6 p-4 rounded-2xl bg-red-950/80 border border-red-500/50 text-red-200 text-xs shadow-lg animate-pulse">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" class="space-y-6">
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-purple-300 mb-2">Фотография вещи</label>
            <input type="file" name="photo" accept="image/*" required
                class="w-full text-xs text-purple-300 file:mr-4 file:py-3 file:px-5 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-purple-600 file:text-white hover:file:bg-purple-500 file:cursor-pointer bg-purple-950/40 rounded-2xl border border-purple-500/30 p-2 transition shadow-inner">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-purple-300 mb-2">Категория</label>
            <select name="category" required
                class="w-full px-4 py-3.5 rounded-2xl bg-purple-950/60 border border-purple-500/30 text-white focus:outline-none focus:border-purple-400 transition text-sm shadow-inner">
                <option value="" disabled selected>Выбери категорию</option>
                {% for key, label in category_labels.items() %}
                    <option value="{{ key }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-purple-300 mb-2">Описание (необязательно)</label>
            <input type="text" name="description" placeholder="Напр.: Черное худи оверсайз"
                class="w-full px-4 py-3.5 rounded-2xl bg-purple-950/60 border border-purple-500/30 text-white placeholder-purple-400/30 focus:outline-none focus:border-purple-400 transition text-sm shadow-inner">
        </div>

        <button type="submit" class="w-full py-4 rounded-2xl font-bold text-white bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600 neon-glow transition transform hover:-translate-y-0.5 shadow-xl">
            Сохранить в гардероб ✨
        </button>
    </form>
</div>
{% endblock %}
