<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Стилист Гардероба</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes floatBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .animate-fade-in {
            animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-pulse-slow {
            animation: pulseGlow 6s ease-in-out infinite;
        }
        body {
            background: linear-gradient(135deg, #070514, #181032, #0d091e, #1f123d);
            background-size: 300% 300%;
            animation: floatBg 20s ease infinite;
            color: #f3f4f6;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        /* Сложный стекломорфизм с неоновой подсветкой */
        .glass-panel {
            background: rgba(20, 16, 45, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-panel:hover {
            border-color: rgba(168, 85, 247, 0.45);
            box-shadow: 0 16px 50px 0 rgba(107, 33, 168, 0.3), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
            transition: all 0.3s ease;
        }
        .neon-glow:hover {
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.8), 0 0 10px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
        /* Эффект шума/сетки на фоне */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.15;
            background-image: radial-gradient(rgba(168, 85, 247, 0.4) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-purple-500 selection:text-white">
    <!-- Интерактивный фон с анимацией от мыши -->
    <canvas id="bg-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none;"></canvas>
    <div class="bg-mesh"></div>

    <!-- Декоративные световые пятна на фоне -->
    <div class="fixed top-1/4 left-10 w-96 h-96 bg-purple-600/15 rounded-full blur-3xl pointer-events-none animate-pulse-slow"></div>
    <div class="fixed bottom-10 right-10 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none animate-pulse-slow" style="animation-delay: 3s;"></div>

    <header class="glass-panel sticky top-0 z-50 border-b border-purple-900/40">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="text-xl font-black tracking-tight bg-gradient-to-r from-purple-400 via-indigo-300 to-pink-400 bg-clip-text text-transparent hover:opacity-80 transition flex items-center gap-2">
                <span class="inline-block animate-spin" style="animation-duration: 8s;">✨</span> AI Stylist
            </a>
            <nav class="flex gap-2 sm:gap-4 items-center">
                <a href="/" class="px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-purple-800/40 transition text-purple-200">Главная</a>
                <a href="/wardrobe" class="px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-purple-800/40 transition text-purple-200">Гардероб</a>
                <a href="/settings" class="px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-purple-800/40 transition text-purple-200">Параметры</a>
                <a href="/outfit" class="px-4 py-2 rounded-xl text-sm font-semibold bg-gradient-to-r from-purple-600 to-indigo-600 text-white neon-glow">Собрать образ</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto px-6 py-10 animate-fade-in relative z-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-8 text-xs text-purple-400/60 border-t border-purple-900/20 relative z-10">
        AI Wardrobe & Outfit Assistant • bluz🔮
    </footer>

    <!-- Скрипт интерактивных частиц, реагирующих на мышь -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const mouse = { x: null, y: null, radius: 130 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.size = Math.random() * 2 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < mouse.radius) {
                        let angle = Math.atan2(dy, dx);
                        let force = (mouse.radius - distance) / mouse.radius;
                        this.x -= Math.cos(angle) * force * 3.5;
                        this.y -= Math.sin(angle) * force * 3.5;
                    }
                }
            }

            draw() {
                ctx.fillStyle = 'rgba(168, 85, 247, 0.45)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            let count = Math.floor((width * height) / 14000);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        initParticles();

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 110) {
                        ctx.strokeStyle = `rgba(168, 85, 247, ${0.18 * (1 - dist / 110)})`;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
