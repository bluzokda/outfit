{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto glass-panel rounded-3xl p-6 sm:p-8 border border-purple-500/30 shadow-2xl">
    <h1 class="text-2xl font-bold text-white mb-2">Сбор нового образа</h1>
    <p class="text-sm text-purple-300/70 mb-6">ИИ учтет погоду и цели твоего выхода</p>

    {% if error %}
        <div class="mb-6 p-4 rounded-xl bg-red-950/60 border border-red-500/40 text-red-200 text-sm">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" class="space-y-5" id="outfitForm">
        <div>
            <label class="block text-sm font-medium text-purple-200 mb-2">Куда собираешься? (Повод)</label>
            <input type="text" name="occasion" required placeholder="Напр.: на учебу, свидание, прогулка"
                class="w-full px-4 py-3 rounded-xl bg-purple-950/50 border border-purple-500/30 text-white placeholder-purple-400/40 focus:outline-none focus:border-purple-400 transition">
        </div>

        <div>
            <label class="block text-sm font-medium text-purple-200 mb-2">Город</label>
            <div class="flex gap-2">
                <input type="text" name="city" id="cityInput" placeholder="Напр.: Москва"
                    class="w-full px-4 py-3 rounded-xl bg-purple-950/50 border border-purple-500/30 text-white placeholder-purple-400/40 focus:outline-none focus:border-purple-400 transition">
                <button type="button" onclick="getLocation()" title="Использовать геолокацию"
                    class="px-4 py-3 rounded-xl bg-purple-900/60 border border-purple-500/30 text-purple-200 hover:bg-purple-800 transition flex items-center justify-center">
                    📍
                </button>
            </div>
        </div>

        <input type="hidden" name="lat" id="lat">
        <input type="hidden" name="lon" id="lon">

        <button type="submit" id="submitBtn" class="w-full py-3.5 rounded-xl font-bold text-white bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600 neon-glow transition transform hover:-translate-y-0.5">
            Сгенерировать образ ✨
        </button>
    </form>
</div>

<script>
function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            document.getElementById('lat').value = position.coords.latitude;
            document.getElementById('lon').value = position.coords.longitude;
            document.getElementById('cityInput').value = "Геолокация определена";
            document.getElementById('cityInput').disabled = true;
        }, function(error) {
            alert("Не удалось определить геолокацию. Введите город вручную.");
        });
    } else {
        alert("Геолокация не поддерживается вашим браузером.");
    }
}
</script>
{% endblock %}
